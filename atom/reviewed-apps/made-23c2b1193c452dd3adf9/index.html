<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
    }
    
    .app-container {
      display: grid;
      place-content: center;
      text-align: center;
      height: 100%;
      width: 100%;
      position: relative;
    }
    
    .light-container {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .light {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background-color: #4285f4;
      box-shadow: 0 0 60px 20px rgba(66, 133, 244, 0.5);
      transition: background-color 0.5s, box-shadow 0.5s;
      animation: breathe 4s infinite ease-in-out;
    }
    
    .light.amber {
      background-color: #fbbc05;
      box-shadow: 0 0 60px 20px rgba(251, 188, 5, 0.5);
    }
    
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    
    .controls {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
    }
    
    button {
      padding: 14px 24px;
      border: none;
      border-radius: 16px;
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    button:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    
    button:focus {
      outline: 2px solid var(--atom-focus-color, #4285f4);
      outline-offset: 2px;
    }
    
    .paused {
      animation-play-state: paused;
    }
    
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .back-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: none;
    }
    
    .back-button{padding:12px} .back-button svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <button class="back-button" aria-label="返回桌面" data-atom-back>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
    </div>
    
    <div class="light-container">
      <div class="light" id="light"></div>
    </div>
    
    <div class="controls">
      <button id="toggle-btn">暂停</button>
      <button id="color-btn">切换颜色</button>
    </div>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const light = document.getElementById('light');
      const toggleBtn = document.getElementById('toggle-btn');
      const colorBtn = document.getElementById('color-btn');
      let isPaused = false;
      let isAmber = false;
      
      // Check if reduced motion is enabled
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      
      // Handle back button
      document.querySelector('.back-button').addEventListener('click', () => {
        AtomApp.home();
      });
      
      // Toggle pause/resume animation
      toggleBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        if (isPaused) {
          light.classList.add('paused');
          toggleBtn.textContent = '继续';
        } else {
          light.classList.remove('paused');
          toggleBtn.textContent = '暂停';
        }
      });
      
      // Toggle light color
      colorBtn.addEventListener('click', () => {
        isAmber = !isAmber;
        if (isAmber) {
          light.classList.add('amber');
          colorBtn.textContent = '切换为蓝色';
        } else {
          light.classList.remove('amber');
          colorBtn.textContent = '切换为琥珀色';
        }
      });
      
      AtomApp.onSuspend(() => { light.classList.add('paused'); });
      window.addEventListener('message', event => {
        if(event.source===parent && event.data?.type==='atom:input-settings') {
          light.style.animation=event.data.motion===false || prefersReducedMotion?'none':'';
        }
      });
      // Apply reduced motion if needed
      if (prefersReducedMotion) {
        light.style.animation = 'none';
      }
    });
  </script>
</body>
</html>
