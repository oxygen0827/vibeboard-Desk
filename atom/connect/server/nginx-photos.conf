# Insert inside the same TLS server as the existing /atom/ reverse proxy.
# Only the authenticated photo upload endpoint accepts a larger body.
location = /atom/market/v1/photos {
    limit_req zone=atom_api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 6m;
    proxy_pass http://host.docker.internal:9092/market/v1/photos;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
