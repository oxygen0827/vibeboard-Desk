# 1) Inside the http { } block, next to other top-level directives:
limit_req_zone $binary_remote_addr zone=atom_api:10m rate=10r/s;

# 2) Inside the ldcx.tech `listen 443 ssl` server { } block, before other prefix locations:
location = /atom { return 308 /atom/; }
location /atom/ {
    limit_req zone=atom_api burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 3m;
    proxy_pass http://host.docker.internal:9092/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_buffering off;
}
