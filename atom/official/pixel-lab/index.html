<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>像素实验室</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="device-ui.css"></head><body data-atom-app="pixel-lab"><canvas id="stage" aria-label="点阵画布，可拖动绘制生命细胞、沙粒或水波"></canvas><header><div><strong>像素实验室</strong><small id="stats">80 × 44 点阵</small></div><select id="mode" aria-label="实验模式"><option value="life">生命演化</option><option value="sand">重力沙粒</option><option value="water">涟漪水面</option></select></header><footer><button id="pause">暂停</button><button id="seed">加入种子</button><button id="clear">清空</button><button id="undo">撤销</button><label>笔触 <input id="brush" type="range" min="1" max="4" value="2" aria-label="笔触大小"></label></footer><div id="hint">拖动绘制 · 细胞按生命规则演化</div><div id="error" role="status"></div><script src="app.js"></script></body></html>
