<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>迷你钢琴</title><link rel="stylesheet" href="style.css"></head><body class="piano"><canvas width="480" height="360" aria-label="迷你钢琴画面"></canvas><header class="scene-head"><button data-atom-back aria-label="返回桌面">‹ 桌面</button><div><h1>迷你钢琴</h1><small>Yamaha C5 · 按住滑奏</small></div><button data-sound aria-pressed="false">声音 关</button></header><div class="song-picker"><select id="song" aria-label="选择完整钢琴作品"></select><select id="speed" aria-label="演奏速度"><option value="0.8">舒缓 0.8×</option><option value="1" selected>原速 1×</option><option value="1.15">轻快 1.15×</option><option value="1.3">活泼 1.3×</option></select></div><div class="controls"><span id="notice" role="status">轻点琴键，弹一段旋律</span><select id="hands" aria-label="演奏声部"><option value="both">双手</option><option value="right">右手</option><option value="left">左手</option></select><button id="tone" aria-pressed="true">表情 开</button><button id="demo">播放</button></div><progress id="progress" value="0" max="1" aria-label="播放进度"></progress><div id="keys" aria-label="琴键"></div><script src="runtime.js"></script><script src="songs.js"></script><script src="samples.js"></script><script src="pianist.js"></script><script src="app.js"></script></body></html>
