<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专注花园</title><link rel="stylesheet" href="style.css"></head><body><header><button id="back" data-atom-back>‹ 桌面</button><h1>专注花园</h1><span id="growth">0 株成长</span></header><main><div id="garden" aria-hidden="true"><div class="sun"></div><div class="hill"></div><svg id="plants" viewBox="0 0 480 130"></svg></div><section class="clock"><div id="phase">给一件小事，留一点时间</div><output id="time" aria-label="剩余时间">25:00</output><div id="duration-row"><label for="duration">这次留出</label><select id="duration" aria-label="专注时长"><option value="5">5 分钟</option><option value="25" selected>25 分钟</option><option value="45">45 分钟</option></select></div><div class="actions"><button id="start" class="primary" disabled>开始专注</button><button id="finish" class="primary" hidden>完成并种下</button><button id="reset" hidden>结束这次</button></div></section><footer><div id="presence">传感器未连接 · 可手动计时</div><div id="away" hidden><span>感知到离开，需要暂停吗？</span><button id="pause-away">暂停</button></div><div class="feedback"><span id="status" role="status">正在读取花园…</span><button id="retry" hidden>重试</button></div></footer></main><script src="app.js"></script></body></html>
