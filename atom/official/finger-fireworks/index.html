<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指尖烟花</title><link rel="stylesheet" href="style.css"></head><body><canvas width="480" height="360" aria-label="指尖烟花画面"></canvas><header class="scene-head"><div><h1>指尖烟花</h1><small>点击夜空 · 数字键 1–9 定点燃放</small></div><button data-sound aria-pressed="false">声音 关</button></header><div class="controls"><button id="words">写一句话</button><button id="auto" aria-pressed="false">自动连放</button><button id="finale" class="primary">齐放</button></div><section class="sheet" hidden><h2>让文字亮起来</h2><p>最多 8 个字，点击燃放即可看见。</p><input maxlength="8" aria-label="烟花文字" value="ATOM"><div class="actions"><button id="cancel">取消</button><button id="send-words" class="primary">燃放文字</button></div></section><script src="runtime.js"></script><script src="app.js"></script></body></html>
