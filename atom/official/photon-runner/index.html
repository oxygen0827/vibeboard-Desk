<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光子快跑</title><link rel="stylesheet" href="style.css"></head><body><canvas width="480" height="360" aria-label="光子快跑画面"></canvas><header class="scene-head"><div><h1>光子快跑</h1><small>点按或 Enter 跃起 · 空格回桌面</small></div><button data-sound aria-pressed="false">声音 关</button></header><div class="scoreboard"><span id="score" class="score">0</span><div class="record">最高纪录 <b id="best">0</b><div id="notice" role="status"></div></div></div><div id="prompt" class="runner-prompt"><h2>穿过下一道光门</h2><p>点按画面或按 Enter，让光子跃起</p></div><div class="controls"><span class="caption">保持轻盈，穿过光门</span><button id="retry-save" hidden>重试保存</button><button id="play" class="primary">开始</button></div><script src="runtime.js"></script><script src="app.js"></script></body></html>
