<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天气之窗</title><link rel="stylesheet" href="style.css"></head><body><img id="landscape" alt="天气摄影背景"><div class="veil"></div><main id="main"><header><button id="city" aria-label="选择城市"><span id="place">上海</span><span class="chevron">⌄</span></button><div class="top-actions"><button id="gallery" aria-label="浏览天气摄影">风景</button><button id="refresh" aria-label="刷新天气">↻</button></div></header><section class="weather"><p id="condition">天气之窗</p><div id="temperature">—<sup>°</sup></div><p id="range">正在获取天气</p></section><div class="scene-caption"><span id="scene-name">晴空</span><span id="source-photo"></span></div><footer><span id="status" role="status">准备中</span><span id="data-source">Open-Meteo</span></footer></main><section id="picker" hidden><header><button id="close-picker">‹ 返回</button><h1>选择城市</h1></header><form id="search"><input id="query" maxlength="60" placeholder="输入城市名称" aria-label="城市名称"><button>查找</button></form><p id="search-status" role="status">常用城市</p><div id="results"></div><p class="privacy">手动选择城市，不读取定位。</p></section><section id="art" hidden><header><button id="close-art">‹ 天气</button><span>天气摄影集 · 非实时画面</span></header><div class="art-title"><span id="art-index"></span><h1 id="art-label"></h1><p id="art-credit"></p></div><div class="art-nav"><button id="prev-art" aria-label="上一张">←</button><span>晴空 / 云海 / 雨窗 / 山雾 / 雪境 / 雷光 / 星夜</span><button id="next-art" aria-label="下一张">→</button></div></section><script src="scenes.js"></script><script src="app.js"></script></body></html>
