<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掌心节拍</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><h1>掌心节拍</h1><span>把节奏，留在桌上。</span></div><button id="sound" aria-label="切换节拍音色">木音</button></header><section class="stage"><canvas id="orbit" width="480" height="190" aria-label="随节拍运动的节奏轨迹"></canvas><button id="tap" aria-label="连续点按定速"><span id="bpm">96</span><small>BPM · 点按定速</small></button><div id="beats" aria-label="每小节拍数"></div><div class="signature"><button id="meter" aria-label="切换每小节拍数">4 拍</button><button id="division" aria-label="切换细分节奏">整拍</button></div></section><section class="transport"><button id="slower" aria-label="减慢一分钟一拍">−</button><input id="tempo" type="range" min="40" max="200" value="96" aria-label="每分钟拍数"><button id="faster" aria-label="加快一分钟一拍">＋</button><button id="play">开始</button></section><footer><button id="listen">拍手定速</button><span id="status" role="status">点四下，让它跟上你</span></footer></main><section id="mic" hidden><div class="mic-head"><h2>拍手，给一个节奏。</h2><button id="close-mic">关闭</button></div><div class="hands" aria-hidden="true"><svg viewBox="0 0 100 70"><path d="m25 55-12-20q-4-8 3-10l12 13-8-24q-2-7 4-7l13 26-4-24q0-6 6-5l9 29 8-17q5-6 9-1l-8 28q-5 13-17 17Z"/><path d="m70 50 14-23q5-5 8 0l-8 20q-3 12-17 15M64 9l5-7M77 17l8-5M81 9l4-6"/></svg></div><p id="mic-message">先安静一秒，再均匀拍手 4–6 下。</p><div id="claps"><i></i><i></i><i></i><i></i></div><p class="mic-note">声音只在本机分析 · 最多 20 秒<br>不会上传或调用语音模型</p><button id="start-mic">开启麦克风</button></section><script src="rhythm.js"></script><script src="app.js"></script></body></html>
