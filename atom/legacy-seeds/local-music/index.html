<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随身唱片</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font:16px system-ui,sans-serif;background:var(--atom-paper,#f3f0e8);color:var(--atom-ink,#242622);padding:14px;display:flex;flex-direction:column;gap:10px}h1{font-size:22px;margin:0}p{margin:0}button,input,select{font:inherit;color:inherit}button{min-height:44px;border:1px solid var(--atom-line,#bbb);border-radius:6px;background:transparent;padding:7px 12px}button:active{background:var(--atom-line,#ddd)}button:focus-visible{outline:2px solid var(--atom-accent,#df5038)}.primary{background:var(--atom-action,#b53c28);color:var(--atom-paper,#fff);border:0}.row{display:flex;align-items:center;gap:8px}.row>*{min-width:0}.row input{flex:1;width:100%;height:44px;background:transparent;border:1px solid var(--atom-line,#bbb);padding:8px}.muted{font-size:13px;color:var(--atom-secondary-text,#62665d)}.grow{flex:1;min-height:0}.atom-scroll{overflow-y:auto;min-height:0;flex:1}.view{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}.view[hidden]{display:none}.number{font:64px ui-monospace,monospace;line-height:1.15}.bar{height:4px;background:var(--atom-line,#ddd)}.bar i{display:block;background:var(--atom-accent,#df5038);height:100%;width:0} .list-item{display:flex;gap:6px;border-bottom:1px solid var(--atom-line,#ddd);padding:6px 0;align-items:center}.list-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .list-item button{flex-shrink:0}.record{display:flex;align-items:center;gap:24px}.record>div:last-child{flex:1;min-width:0}#title{font-size:22px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.disc{width:116px;height:116px;flex-shrink:0;border-radius:50%;background:var(--atom-ink,#242622);color:var(--atom-paper,#fff);border:14px double var(--atom-secondary-text,#62665d);font-size:54px;text-align:center;line-height:88px}.playing{animation:spin 8s linear infinite}.transport>*{flex:1}input[type=range]{height:24px;border:0;padding:0}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><section class="view" id="player"><div class="row"><h1 class="grow" style="padding-left:44px;font-size:20px">随身唱片</h1><button id="library">歌单</button></div><div class="grow record"><div class="disc" id="disc">♪</div><div><p id="title">添加你的音乐</p><p class="muted" id="state">音频在本机播放，无需上传</p></div></div><div class="row muted"><span id="elapsed">00:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"><span id="duration">00:00</span></div><div class="row transport"><button id="prev">上一首</button><button id="play" class="primary">添加音乐</button><button id="next">下一首</button></div><div class="row muted"><span>音量</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="音量"><button id="mode">顺序播放</button></div></section><section id="queue" class="view" hidden><div class="row"><button id="back">返回</button><h1 class="grow">本地歌单</h1><button id="add" class="primary">添加</button></div><p class="muted">选择本机音频；退出应用后需要重新选择。</p><div id="songs" class="atom-scroll"></div></section><input id="files" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac" multiple hidden><script>var audio=new Audio(),songs=[],index=-1,repeat=false;audio.volume=.7;var $=function(x){return document.getElementById(x)};function time(n){n=Math.floor(n||0);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function show(list){$('queue').hidden=!list;$('player').hidden=list}function list(){var el=$('songs');el.textContent='';if(!songs.length)el.textContent='歌单还没有歌曲，点击添加。';songs.forEach(function(s,i){var row=document.createElement('div');row.className='list-item';var text=document.createElement('span');text.textContent=(i===index?'▶ ':'')+s.name;var b=document.createElement('button');b.textContent='播放';b.onclick=function(){load(i,true);show(false)};row.append(text,b);el.appendChild(row)})}function load(i,play){if(!songs.length){list();show(true);return}index=(i+songs.length)%songs.length;audio.src=songs[index].url;$('title').textContent=songs[index].name;$('state').textContent=(index+1)+' / '+songs.length+' · 本地音频';list();if(play)audio.play().catch(function(){$('state').textContent='格式不支持或无法播放，请尝试MP3/WAV'})}function update(){$('play').textContent=index<0?'添加音乐':audio.paused?'播放':'暂停';$('disc').classList.toggle('playing',!audio.paused)}$('files').onchange=function(){Array.from(this.files).forEach(function(f){songs.push({name:f.name,url:URL.createObjectURL(f)})});list();if(index<0&&songs.length)load(0,false);this.value='';update()};$('add').onclick=function(){$('files').click()};$('library').onclick=function(){list();show(true)};$('back').onclick=function(){show(false)};$('play').onclick=function(){if(index<0){load(0,false);return}if(audio.paused)audio.play().catch(function(){$('state').textContent='此音频无法播放'});else audio.pause()};$('prev').onclick=function(){load(index-1,true)};$('next').onclick=function(){load(index+1,true)};$('mode').onclick=function(){repeat=!repeat;this.textContent=repeat?'单曲循环':'顺序播放'};$('volume').oninput=function(){audio.volume=+this.value};$('seek').oninput=function(){if(isFinite(audio.duration))audio.currentTime=this.value/1000*audio.duration};audio.onplay=audio.onpause=update;audio.ontimeupdate=function(){$('elapsed').textContent=time(audio.currentTime);$('duration').textContent=time(audio.duration);$('seek').value=audio.duration?audio.currentTime/audio.duration*1000:0};audio.onended=function(){load(repeat?index:index+1,true)};audio.onerror=function(){$('state').textContent='无法解码此文件，请尝试MP3/WAV';update()};function stop(){audio.pause();audio.removeAttribute('src');audio.load();songs.forEach(s=>URL.revokeObjectURL(s.url));songs=[];}if(window.AtomApp){AtomApp.onSuspend(stop);AtomApp.navigation.setBackHandler(()=>{if(!$('queue').hidden)show(false);else AtomApp.home()});}window.addEventListener('pagehide',stop);</script></body></html>
