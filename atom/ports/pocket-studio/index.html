<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><script src="scene-session.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#15201f;color:#e1eee4;font:13px sans-serif}.app{height:100%;display:flex;flex-direction:column;padding:12px;gap:10px}.head{display:flex;justify-content:space-between;align-items:center}.head b{font-size:17px}.head span{font-size:11px;color:#93b09c}.bar{display:flex;align-items:center;gap:7px}button,select{border:1px solid #476253;border-radius:6px;background:#24382c;color:#e1eee4;font:13px sans-serif;min-height:34px;padding:5px 9px}button.play{background:#dce8a8;color:#263526;min-width:66px}#tempo{min-width:0;flex:1;accent-color:#dce8a8}.grid{flex:1;min-height:0;display:grid;grid-template-columns:42px repeat(16,1fr);grid-template-rows:18px repeat(7,1fr);gap:3px}.grid .step{min-height:0;min-width:0;padding:0;border-radius:3px;background:#263c32;border:1px solid #365046}.grid .step.on{background:#dce8a8;border-color:#ecf5cc}.grid .step.beat{box-shadow:inset 0 0 0 2px #f1ab72}.grid .step:nth-child(4n){border-left-color:#789084}.name{font-size:11px;display:flex;align-items:center;color:#a5bcae}.num{font-size:9px;color:#84998b;text-align:center}.bottom{display:flex;gap:7px;align-items:center}.bottom button{flex:1}.status{min-height:15px;font-size:11px;color:#a6beac}canvas{width:80px;height:25px}#error{color:#ffae98}</style><style data-product-review>.atomtitle,.head,.top{left:56px!important;right:12px!important;max-width:calc(100% - 68px)}.atomtitle strong,.head h1,.top strong{font-size:16px!important}.atomtitle{min-height:40px}</style></head><body><div class="app"><div class="head"><b>口袋音乐工作站</b><span>16 步 · 7 轨 · 离线合成</span></div><div class="bar"><button id="play" class="play">播放</button><span id="bpm">110</span><input id="tempo" type="range" min="60" max="180" value="110"><select id="preset"><option value="0">夜航</option><option value="1">街机</option><option value="2">空白</option></select><canvas id="scope" width="80" height="25"></canvas></div><div id="grid" class="grid"></div><div class="bottom"><button id="random">变奏</button><button id="clear">清空</button><button id="save">保存</button><button id="restore">恢复</button></div><div id="status" class="status">点击格子编曲，播放后可继续修改</div><div id="error"></div></div><script crossorigin="anonymous" src="Tone.js"></script><script crossorigin="anonymous" src="main.js"></script></body></html>
