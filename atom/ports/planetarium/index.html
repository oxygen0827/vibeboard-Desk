<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><script src="scene-session.js"></script><script src="scene-controls.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#03050b;color:#fff;font:14px system-ui,sans-serif}canvas,#scene{display:block;width:100%;height:100%}.head{position:fixed;top:12px;left:14px;pointer-events:none;text-shadow:0 1px 5px #000}h1{font-size:20px;margin:0}p{font-size:11px;color:#b9c7d9;margin:5px 0}.controls{position:fixed;bottom:12px;left:12px;right:12px;display:flex;gap:6px}button{min-height:44px;flex:1;background:#111b30df;border:1px solid #45516b;color:#e9edfa;border-radius:7px;font:14px system-ui;padding:6px 8px}button.active{background:#eed4ac;color:#192137}.fps{position:fixed;right:14px;top:15px;font:11px monospace;color:#b9c7d9;pointer-events:none}button:focus-visible{outline:2px solid white}#failure{position:fixed;top:100px;left:20px;right:20px;background:#182034;padding:16px;display:none}</style><style data-product-review>.atomtitle,.head,.top{left:56px!important;right:12px!important;max-width:calc(100% - 68px)}.atomtitle strong,.head h1,.top strong{font-size:16px!important}.atomtitle{min-height:40px}</style></head><body><div id="scene"></div><div class="head"><h1 id="title">正在加载天体…</h1><p>Spacekit · 拖动环绕 · 滚轮缩放</p></div><div class="controls"><button data-planet="earth" class="active">地球</button><button data-planet="jupiter">木星</button><button data-planet="saturn">土星</button><button id="spin">暂停巡航</button></div><span id="fps" class="fps">测量中</span><div id="failure"></div><script>window.addEventListener("error",function(e){var n=document.getElementById("failure");n.style.display="block";n.textContent="渲染失败："+e.message;});var frames=0,last=performance.now();function measure(t){frames++;if(t-last>1000){document.getElementById("fps").textContent=Math.round(frames*1000/(t-last))+" FPS";frames=0;last=t}AtomSceneSession.frame(measure)}AtomSceneSession.frame(measure);</script><script crossorigin="anonymous" src="spacekit.js"></script><script crossorigin="anonymous" src="main.js"></script></body></html>
