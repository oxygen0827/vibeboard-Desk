<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>合奏伙伴</title><style>#timeline{display:block;width:calc(100% - 30px);height:100px;margin:0 15px;background:#ffffff06;border-radius:15px}.bar{display:flex;align-items:center;gap:7px;padding:9px 15px}.bar button{min-height:32px;font-size:12px;padding:0 11px}.bar label{font-size:11px;color:#a8b4c4}.bar input{width:55px;padding:5px}.keys{height:73px;display:flex;gap:3px;margin:0 15px}.key{flex:1;padding:0;background:linear-gradient(#e9edf5,#b9c9d9);color:#2d435a;border-radius:4px 4px 9px 9px;font-size:11px;touch-action:none}.key:nth-child(2n){background:linear-gradient(#a4c8d7,#7aa7bd)}.key.on{background:#eac38c;transform:translateY(2px)}footer{padding-top:4px}.entry input{font-size:12px}header small{display:block;margin-top:3px}</style><body><header><div><h1 id="title">你先弹，我来接</h1><small>DUET / A CONVERSATION IN NOTES</small></div><button id="save">保存合奏</button></header><canvas id="timeline" width="450" height="100" aria-label="旋律时间线"></canvas><div class="bar"><button id="play">播放合奏</button><button id="clear">重新弹奏</button><label>速度 <input id="bpm" type="number" min="50" max="160" value="90"></label><small id="count">0 个音符</small></div><div class="keys" id="keys"></div><footer><div class="entry"><input id="prompt" aria-label="合奏风格" placeholder="接一段温柔的雨夜旋律…" maxlength="1000"><button class="primary" id="generate" disabled>AI 接奏</button></div><div class="status" id="status">正在读取合奏…</div></footer><script src="bridge.js"></script><script src="app.js"></script></body></html>
