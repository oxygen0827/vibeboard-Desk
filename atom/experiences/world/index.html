<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>共生世界</title></head><body><canvas id="world" aria-label="可拖动旋转的小岛"></canvas><header><div class="eyebrow">A WORLD OF YOUR OWN</div><h1 id="title">海边的慢时光</h1><p id="hint">拖动小岛 · 轻触屋舍</p></header><nav aria-label="世界氛围"><button data-sky="day" title="白昼">昼</button><button data-sky="sunset" title="日落">暮</button><button data-sky="night" title="夜晚">夜</button><button id="weather" title="切换天气">晴</button></nav><button id="compose" aria-label="用语言改变世界">✦ <span>说出你的世界</span></button><section id="editor" hidden><form id="form"><label for="prompt">让这个世界，长成你的想象</label><textarea id="prompt" maxlength="600" placeholder="海边开一间咖啡馆，下着雨，窗户暖一点…"></textarea><div class="actions"><button type="button" id="close">收起</button><button type="button" id="retry" hidden>重试读取</button><button type="button" id="create">创造变化 ↗</button></div></form></section><output id="status" aria-live="polite"></output><script src="app.js"></script></body></html>
