<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Agent 小屋</title><style>body{background:#111c25}header{position:absolute;z-index:1;top:0;width:100%}header small{display:block;margin-top:3px}canvas{width:100%;height:100%;image-rendering:pixelated}#panel{position:absolute;bottom:12px;left:14px;right:14px;background:#172632eb;border:1px solid #ffffff1a;border-radius:18px;padding:12px 14px;backdrop-filter:blur(10px)}#task{font-size:15px;margin-bottom:5px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}#detail{font-size:12px;color:#b8c8d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:18px}.actions{display:flex;gap:7px;align-items:center;margin-top:9px}.actions button{min-height:34px;padding:0 12px;font-size:12px}#page{font-size:11px;color:#91acbd;min-width:30px;text-align:center}#open{margin-left:auto}#feedback{font-size:11px;color:#e8bd8b;min-height:14px;padding-top:3px}</style><body><header><div><h1>Agent 小屋</h1><small id="connection">正在请求真实状态</small></div><button id="refresh">刷新</button></header><canvas id="room" width="240" height="180" aria-label="任务工作室"></canvas><section id="panel"><div id="task">等候连接</div><div id="detail">任务、审批和完成均来自真实电脑</div><div class="actions"><button id="prev" aria-label="上一项">←</button><span id="page">0 / 0</span><button id="next" aria-label="下一项">→</button><button class="primary" id="open">打开我的电脑</button></div><div id="feedback"></div></section><script src="app.js"></script></body></html>
