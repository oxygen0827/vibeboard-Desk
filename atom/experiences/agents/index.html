<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Agent 小屋</title></head><body data-view="room"><header><button id="back" data-atom-back aria-label="返回桌面">‹ 桌面</button><div><h1>Agent 小屋</h1><small id="connection">正在读取真实状态</small></div><button id="view">任务</button><button id="refresh">刷新</button></header><canvas id="room" width="240" height="180" aria-label="由真实任务状态驱动的工作室"></canvas><section id="living"><div class="living-caption"><span id="mood">一盏灯，等一个新想法。</span><small id="sensor-status">传感器未连接 · 手动陪伴</small></div><div class="living-controls"><button id="presence-demo">体验离开</button><button id="sway">轻轻摇一摇</button></div><small id="demo-label">手动操作不会改变真实任务</small></section><section id="panel"><div class="filter"><select id="computer" aria-label="关注的电脑"><option value="">所有电脑</option></select><button id="follow">关注此任务</button><small id="updated"></small></div><div id="task">等候连接</div><div id="detail">任务、审批和完成均来自真实电脑</div><div class="actions"><button id="prev" aria-label="上一项">←</button><span id="page">0 / 0</span><button id="next" aria-label="下一项">→</button><button id="new">新任务</button><button class="primary" id="open">查看任务</button></div><div class="feedback-row"><div id="feedback" role="status"></div><button id="retry-save" hidden>重试</button></div></section><script src="app.js"></script></body></html>
