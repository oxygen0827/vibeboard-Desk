name: ATOM checks
on:
  push:
    paths: ['atom/**', 'README.md', 'AGENTS.md', '.github/workflows/atom.yml']
  pull_request:
    paths: ['atom/**', 'README.md', 'AGENTS.md', '.github/workflows/atom.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: atom/package-lock.json
      - run: npm --prefix atom ci
      - run: python3 -m pip install -r atom/connect/server/requirements.txt cryptography
      - run: cd atom && npx playwright install --with-deps chromium webkit
      - name: Device service
        run: python3 -m unittest discover -s atom/tests
      - name: Relay and source marketplace
        run: |
          python3 -m unittest discover -s atom/connect/relay -p 'test_*.py'
          python3 -m unittest discover -s atom/connect/marketplace -p 'test_*.py'
      - name: Computer companion and application runtime
        run: |
          npm --prefix atom run test:computer
          npm --prefix atom run test:runtime
      - name: Browser applications (fixture APIs)
        run: npm --prefix atom run test:ui
      - name: Creation community and Mac preview (Chromium and WebKit)
        run: npm --prefix atom run test:community
      - name: Creative experiences and product guide
        run: |
          npm --prefix atom run test:experiences
          npm --prefix atom run test:site
